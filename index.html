<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --success-dark: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Header Card */
        .header-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius);
            padding: 28px 24px 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--success), var(--primary));
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--success));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 2px;
        }

        /* QR Wrapper */
        .qr-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .qr-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(99, 102, 241, 0.05) 50%, transparent 60%);
            animation: qrShine 4s ease-in-out infinite;
        }

        @keyframes qrShine {
            0%, 100% { transform: translateX(-30%) translateY(-30%); }
            50% { transform: translateX(30%) translateY(30%); }
        }

        #qrImage {
            width: 200px;
            height: 200px;
            display: block;
            border-radius: 12px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .qr-label {
            color: #1e293b;
            font-size: 13px;
            font-weight: 700;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .qr-label i { color: var(--success); }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn:hover::after { opacity: 1; }

        .btn:active { transform: scale(0.97); }

        .btn-success {
            background: linear-gradient(135deg, var(--success), var(--success-dark));
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.4);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.4);
        }

        /* Section Card */
        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .section-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .section-header .title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header .title i {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
        }

        .title-icon-indigo {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .title-icon-emerald {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .title-icon-amber {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        /* QR Generator */
        .qr-generate {
            padding: 16px 20px 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: white;
            transition: all 0.25s;
            font-family: inherit;
            font-weight: 500;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-group button {
            padding: 13px 22px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.4);
        }

        .input-group button:active { transform: scale(0.97); }

        /* QR Preview */
        .qr-preview {
            margin-top: 16px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            text-align: center;
            display: none;
        }

        .qr-preview.show {
            display: block;
            animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-preview img {
            max-width: 180px;
            height: auto;
            border-radius: 12px;
            background: white;
            padding: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .qr-info {
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .qr-info strong { color: var(--text-primary); font-weight: 700; }

        .qr-actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .qr-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--success), var(--success-dark));
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        .btn-close {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid var(--border) !important;
        }

        .btn-close:hover { background: rgba(255, 255, 255, 0.15); }

        /* Connection Status */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            margin-bottom: 16px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .dot.online {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
            animation: pulseGreen 2s ease-in-out infinite;
        }

        .dot.offline {
            background: #f87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.6);
            animation: pulseRed 1.2s ease-in-out infinite;
        }

        .dot.checking {
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
            animation: pulseYellow 1s ease-in-out infinite;
        }

        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 8px rgba(74, 222, 128, 0.6); }
            50% { box-shadow: 0 0 16px rgba(74, 222, 128, 0.9); }
        }

        @keyframes pulseRed {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes pulseYellow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Status Alert */
        #status {
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.5;
        }

        #status i { font-size: 18px; flex-shrink: 0; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #status.success {
            display: flex;
            background: rgba(16, 185, 129, 0.12);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        #status.error {
            display: flex;
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        #status.info {
            display: flex;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        #status.warning {
            display: flex;
            background: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        /* Scanner */
        .scanner-wrapper {
            padding: 16px 20px 20px;
        }

        .scanner-area {
            position: relative;
            background: #0d0d1a;
            border-radius: var(--radius-sm);
            min-height: 280px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        #qr-reader {
            width: 100% !important;
            min-height: 280px;
            background: #0d0d1a;
            position: relative;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block !important;
        }

        #qr-reader > div:not(:first-child) { display: none !important; }
        #qr-reader > div:first-child { width: 100% !important; height: auto !important; }
        #qr-reader > div:first-child > div:first-child { width: 100% !important; height: auto !important; }

        .scanner-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scan-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; height: 40%;
            border: 2px solid rgba(99, 102, 241, 0.5);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--primary);
            border-style: solid;
            border-width: 0;
        }

        .corner-tl { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; border-radius: 6px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 6px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 6px; }
        .corner-br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 6px 0; }

        .scan-line {
            position: absolute;
            top: 30%; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), #818cf8, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        @keyframes scanMove {
            0% { top: 25%; opacity: 0.4; }
            50% { top: 75%; opacity: 1; }
            100% { top: 25%; opacity: 0.4; }
        }

        .scan-text {
            position: absolute;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 15;
            white-space: nowrap;
        }

        .scan-text i {
            color: var(--primary);
            font-size: 12px;
            animation: pulseIcon 1.5s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .scanner-controls {
            display: flex;
            gap: 10px;
            padding: 16px 20px 20px;
        }

        .scanner-controls button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-scan {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }

        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.45);
        }

        .btn-scan:active { transform: scale(0.98); }

        .btn-scan.stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
        }

        .btn-scan.stop:hover {
            box-shadow: 0 8px 28px rgba(239, 68, 68, 0.45);
        }

        .btn-flash {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border) !important;
            flex: 0.35 !important;
        }

        .btn-flash:hover { background: rgba(255, 255, 255, 0.1); }

        .btn-flash.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e293b;
            border-color: #fbbf24 !important;
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.4);
        }

        /* Data Table */
        .table-wrapper {
            max-height: 240px;
            overflow-y: auto;
        }

        .table-wrapper::-webkit-scrollbar { width: 4px; }
        .table-wrapper::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }

        .data-section table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-section table th {
            padding: 10px 12px;
            text-align: left;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(12px);
            z-index: 2;
        }

        .data-section table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-weight: 500;
        }

        .data-section table tr:hover td {
            background: rgba(255, 255, 255, 0.025);
        }

        .data-section table tr:last-child td { border-bottom: none; }

        .status-hadir {
            color: #34d399;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-belum {
            color: var(--text-muted);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Loading & Empty State */
        .loading-text {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .loading-text i { margin-right: 8px; }

        /* Footer */
        .footer-note {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.8;
            padding: 16px 0;
        }

        .footer-note i { color: var(--success); }
        .footer-note a { color: var(--primary); text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .footer-note a:hover { color: #818cf8; text-decoration: underline; }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 4px 0 12px;
            gap: 12px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
