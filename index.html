<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --success-dark: #059669;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(139, 92, 246, 0.12) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 26px 22px 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--success), var(--primary));
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ============ ICON CIRCLE ============ */
        .icon-circle {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-size: 26px; color: white;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.35);
            position: relative;
        }

        .icon-circle::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(37, 211, 102, 0.25);
            animation: ringPulse 2.5s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 0; }
        }

        h1 {
            color: #fff;
            font-size: 21px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            text-align: center;
            margin-bottom: 18px;
            font-weight: 500;
        }

        /* ============ QR WRAPPER ============ */
        .qr-wrapper {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            display: inline-block;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .qr-wrapper::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(99, 102, 241, 0.06) 50%, transparent 60%);
            animation: qrShine 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes qrShine {
            0%, 100% { transform: translateX(-30%) translateY(-30%); }
            50% { transform: translateX(30%) translateY(30%); }
        }

        #qrImage {
            width: 200px; height: 200px;
            display: block;
            border-radius: 10px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .qr-wrapper .qr-label {
            color: #1a2a3a;
            font-size: 12px;
            font-weight: 700;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }

        /* ============ BUTTONS ============ */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            flex: 1;
            justify-content: center;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,255,255,0.12), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn:hover::after { opacity: 1; }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
        }

        /* ============ DIVIDER ============ */
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0 12px;
            gap: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        /* ============ SCANNER ============ */
        .scanner-area {
            position: relative;
            background: #1a1a2e;
            border-radius: 18px;
            margin-top: 12px;
            min-height: 280px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #qr-reader {
            width: 100% !important;
            min-height: 280px;
            background: #0d0d1a;
            position: relative;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 0 !important;
            display: block !important;
        }

        #qr-reader > div:not(:first-child) { display: none !important; }
        #qr-reader > div:first-child { width: 100% !important; height: auto !important; }
        #qr-reader > div:first-child > div:first-child { width: 100% !important; height: auto !important; }

        .scanner-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scanner-overlay .scan-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; height: 40%;
            border: 2px solid rgba(99, 102, 241, 0.55);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
        }

        .scanner-overlay .scan-frame .corner {
            position: absolute;
            width: 20px; height: 20px;
            border-color: var(--primary);
            border-style: solid;
            border-width: 0;
        }

        .corner-tl { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; border-radius: 6px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 6px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 6px; }
        .corner-br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 6px 0; }

        .scanner-overlay .scan-line {
            position: absolute;
            top: 30%; left: 20%; right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1, #818cf8, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        @keyframes scanMove {
            0% { top: 30%; opacity: 0.5; }
            50% { top: 70%; opacity: 1; }
            100% { top: 30%; opacity: 0.5; }
        }

        .scanner-overlay .scan-text {
            position: absolute;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 15;
            white-space: nowrap;
        }

        .scanner-overlay .scan-text i {
            color: #6366f1;
            font-size: 12px;
            animation: pulse-icon 1.5s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ============ SCANNER CONTROLS ============ */
        .scanner-controls {
            display: flex;
            gap: 10px;
            padding: 12px 0 0;
        }

        .scanner-controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-scan {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }

        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.45);
        }

        .btn-scan:active { transform: scale(0.98); }

        .btn-scan.stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
        }

        .btn-scan.stop:hover {
            box-shadow: 0 8px 28px rgba(239, 68, 68, 0.45);
        }

        .btn-flash {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            flex: 0.4 !important;
        }

        .btn-flash:hover { background: rgba(255, 255, 255, 0.12); }

        .btn-flash.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e293b;
            border-color: #fbbf24 !important;
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.4);
        }

        /* ============ STATUS ALERT ============ */
        #status {
            padding: 13px 16px;
            border-radius: 13px;
            font-weight: 600;
            font-size: 13px;
            display: none;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            line-height: 1.5;
        }

        #status i { font-size: 16px; flex-shrink: 0; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #status.success {
            display: flex;
            background: rgba(16, 185, 129, 0.12);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        #status.error {
            display: flex;
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        #status.info {
            display: flex;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        #status.warning {
            display: flex;
            background: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        /* ============ DATA SECTION ============ */
        .data-section {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .data-section .data-header {
            padding: 13px 16px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.14), rgba(99, 102, 241, 0.04));
            border-bottom: 1px solid rgba(99, 102, 241, 0.18);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-section .data-header .title {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-section .data-header .title i { color: #818cf8; }

        .data-section .data-header .count {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 700;
            background: rgba(99, 102, 241, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .data-section .table-wrapper {
            max-height: 220px;
            overflow-y: auto;
        }

        .data-section .table-wrapper::-webkit-scrollbar { width: 4px; }
        .data-section .table-wrapper::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .data-section .table-wrapper::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.35);
            border-radius: 4px;
        }

        .data-section table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-section table th {
            padding: 10px 12px;
            text-align: left;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(8px);
            z-index: 2;
        }

        .data-section table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .data-section table tr:hover td { background: rgba(255, 255, 255, 0.025); }
        .data-section table tr:last-child td { border-bottom: none; }

        .data-section table .status-hadir {
            color: #34d399;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .data-section table .status-belum {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* ============ FOOTER ============ */
        .footer-note {
            margin-top: 16px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            line-height: 1.8;
        }

        .footer-note i { color: #25d366; }
        .footer-note a { color: #25d366; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .footer-note a:hover { color: #4ade80; text-decoration: underline; }

        /* ============ LOADING ============ */
        .loading-text {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            font-weight: 500;
        }

        .loading-text i { margin-right: 8px; }

        /* ============ CONNECTION STATUS ============ */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 10px;
            justify-content: center;
        }

        .connection-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-status .dot.online {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
            animation: pulseGreen 2s ease-in-out infinite;
        }

        .connection-status .dot.offline {
            background: #f87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.6);
            animation: pulse-red 1s ease-in-out infinite;
        }

        .connection-status .dot.checking {
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
            animation: pulse-yellow 0.8s ease-in-out infinite;
        }

        @keyframes pulseGreen {
            0%, 100% { box-shadow: 0 0 8px rgba(74, 222, 128, 0.6); }
            50% { box-shadow: 0 0 16px rgba(74, 222, 128, 0.9); }
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse-yellow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ============ QR GENERATE SECTION ============ */
        .qr-generate-section {
            padding: 14px 0 6px 0;
        }

        .qr-generate-section .qr-label {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .qr-generate-section .qr-label i { color: #818cf8; }

        .qr-generate-section .qr-input-group {
            display: flex;
            gap: 10px;
        }

        .qr-generate-section .qr-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: white;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 500;
        }

        .qr-generate-section .qr-input-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
            background: rgba(255, 255, 255, 0.06);
        }

        .qr-generate-section .qr-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .qr-generate-section .qr-input-group button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .qr-generate-section .qr-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.4);
        }

        .qr-generate-section .qr-input-group button:active {
            transform: scale(0.97);
        }

        /* ============ QR PREVIEW ============ */
        .qr-preview {
            margin-top: 14px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            display: none;
        }

        .qr-preview.show {
            display: block !important;
            animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .qr-preview img {
            max-width: 180px;
            height: auto;
            border-radius: 12px;
            background: white;
            padding: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .qr-preview .qr-info {
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);

<body>

<script>
/* ===================================================================
   FRONTEND — Presensi Kelas QR
   Data PERMANEN di Google Sheets (lihat file Code.gs terpisah).
   localStorage hanya sebagai CACHE offline.
   =================================================================== */

/* ---------------- KONFIGURASI ---------------- */
const CONFIG = {
  // ▼▼▼ GANTI dengan URL Web App Apps Script Anda ▼▼▼
  API_URL: 'https://script.google.com/macros/s/AKfycbwFaiXWeQmp9D1U6YKlNM2u28Dgp8mcnYmzWxoWXH_FS3Po3oWJt1-kknsCZ_yRDranPQ/exec',
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1PXOSZAXZNg7hvX-33DglZlM3saj4yclUhiYepiFNYhI/edit?gid=0#gid=0',
  SHEET_GID_MAHASISWA: '0',
  SHEET_GID_PRESENSI: '646034675',
  CACHE_KEY_MAHASISWA: 'presensi_mahasiswa_cache_v2',
  CACHE_KEY_PRESENSI: 'presensi_hari_ini_cache_v2',
  REFRESH_INTERVAL_MS: 30000,
  RESCAN_DELAY_MS: 2500
};
/* --------------------------------------------- */

/* ---------------- STATE ---------------- */
const State = {
  scanner: null,
  scanning: false,
  flashOn: false,
  processing: false,
  mahasiswa: [],
  presensiHariIni: {},   // { nim: { waktu, ... } }
  isOnline: false,
  tanggalHariIni: ''
};

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const DOM = {
  status: $('status'),
  scanStatus: $('scanStatusText'),
  presensiStatus: $('presensiStatus'),
  btnStartScan: $('btnStartScan'),
  btnFlash: $('btnFlash'),
  qrImage: $('qrImage'),
  tableBody: $('tableBody'),
  dataTable: $('dataTable'),
  loadingData: $('loadingData'),
  totalMahasiswa: $('totalMahasiswa'),
  statusDot: $('statusDot'),
  statusLabel: $('statusLabel'),
  qrNimInput: $('qrNimInput'),
  qrResultImage: $('qrResultImage'),
  qrInfo: $('qrInfo'),
  qrPreview: $('qrPreview')
};

/* ================== UTIL ================== */
function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function setConnectionStatus(status, message) {
  if (!DOM.statusDot || !DOM.statusLabel) return;
  DOM.statusDot.className = 'dot ' + status;
  DOM.statusLabel.textContent = message;
  State.isOnline = (status === 'online');
}

let statusTimer;
function showStatus(message, type = 'info', duration = 4000) {
  if (!DOM.status) return;
  const iconMap = {
    success: 'fa-check-circle',
    error: 'fa-exclamation-circle',
    warning: 'fa-triangle-exclamation',
    info: 'fa-info-circle'
  };
  DOM.status.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
  DOM.status.className = type;
  DOM.status.style.display = 'flex';
  clearTimeout(statusTimer);
  if (duration > 0) {
    statusTimer = setTimeout(() => { DOM.status.style.display = 'none'; }, duration);
  }
}

/* ================== API HELPER ================== */
async function apiGet(action, params = {}) {
  const qs = new URLSearchParams({ action, t: Date.now(), ...params });
  const res = await fetch(CONFIG.API_URL + '?' + qs.toString(), {
    method: 'GET',
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function apiPost(action, payload = {}) {
  // Pakai text/plain untuk menghindari preflight CORS (Apps Script tidak handle OPTIONS)
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ================== CACHE ================== */
function loadCacheMahasiswa() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_MAHASISWA);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveCacheMahasiswa(data) {
  try { localStorage.setItem(CONFIG.CACHE_KEY_MAHASISWA, JSON.stringify(data)); } catch {}
}

function loadCachePresensi() {
  try {
    const raw = localStorage.getItem(CONFIG.CACHE_KEY_PRESENSI);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.tanggal !== todayStr()) return null; // cache dari hari lain, abaikan
    return parsed.map || {};
  } catch { return null; }
}

function saveCachePresensi(map) {
  try {
    localStorage.setItem(CONFIG.CACHE_KEY_PRESENSI, JSON.stringify({
      tanggal: todayStr(),
      map
    }));
  } catch {}
}

/* ================== LOAD DATA ================== */
async function checkConnection() {
  setConnectionStatus('checking', 'Mengecek koneksi...');
  try {
    const json = await apiGet('ping');
    if (json.success) {
      setConnectionStatus('online', '✅ Terhubung ke server');
      return true;
    }
    throw new Error(json.error || 'Ping gagal');
  } catch (err) {
    setConnectionStatus('offline', '📴 Offline');
    return false;
  }
}

async function loadAllData() {
  State.tanggalHariIni = todayStr();

  // 1) Tampilkan cache dulu supaya UI cepat
  const cachedMhs = loadCacheMahasiswa();
  if (cachedMhs.length) {
    State.mahasiswa = cachedMhs;
    State.presensiHariIni = loadCachePresensi() || {};
    renderDataTable();
  } else {
    if (DOM.loadingData) DOM.loadingData.style.display = 'block';
    if (DOM.dataTable) DOM.dataTable.style.display = 'none';
  }

  // 2) Coba sinkron ke server
  const online = await checkConnection();
  if (!online) {
    if (!cachedMhs.length) {
      showEmptyState('offline');
    } else {
      showStatus('📂 Mode offline — data dari cache', 'warning', 3000);
    }
    return;
  }

  try {
    // Ambil mahasiswa
    const mhsRes = await apiGet('get_all');
    if (mhsRes.success && Array.isArray(mhsRes.data)) {
      State.mahasiswa = mhsRes.data;
      saveCacheMahasiswa(mhsRes.data);
    } else {
      showStatus('⚠️ ' + (mhsRes.error || 'Gagal memuat mahasiswa'), 'warning', 3500);
    }

    // Ambil presensi hari ini
    const presRes = await apiGet('get_presensi', { tanggal: todayStr() });
    if (presRes.success && Array.isArray(presRes.data)) {
      const map = {};
      presRes.data.forEach(p => { if (p.nim) map[String(p.nim).trim()] = p; });
      State.presensiHariIni = map;
      saveCachePresensi(map);
    }

    renderDataTable();
    showStatus(`✅ ${State.mahasiswa.length} mahasiswa · ${Object.keys(State.presensiHariIni).length} hadir hari ini`, 'success', 2500);
  } catch (err) {
    console.error(err);
    if (State.mahasiswa.length) {
      showStatus('⚠️ Gagal sinkron server — pakai cache', 'warning', 3500);
      renderDataTable();
    } else {
      showEmptyState('error', err.message);
    }
  }
}

/* ================== RENDER ================== */
function renderDataTable() {
  if (!DOM.tableBody || !DOM.dataTable || !DOM.loadingData) return;
  DOM.tableBody.innerHTML = '';

  if (!State.mahasiswa.length) {
    showEmptyState('empty');
    return;
  }

  State.mahasiswa.forEach(mhs => {
    const nim = String(mhs.nim || '').trim();
    const hadir = !!State.presensiHariIni[nim];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${escapeHtml(nim || '-')}</strong></td>
      <td>${escapeHtml(mhs.nama || '-')}</td>
      <td>${escapeHtml(mhs.kelas || '-')}</td>
      <td>${escapeHtml(mhs.jurusan || '-')}</td>
      <td>
        <span class="${hadir ? 'status-hadir' : 'status-belum'}">
          <i class="fas ${hadir ? 'fa-check-circle' : 'fa-circle'}"></i>
          ${hadir ? 'Hadir' : 'Belum'}
        </span>
      </td>`;
    DOM.tableBody.appendChild(tr);
  });

  DOM.loadingData.style.display = 'none';
  DOM.dataTable.style.display = 'table';
  const totalHadir = Object.keys(State.presensiHariIni).length;
  DOM.totalMahasiswa.textContent = `${totalHadir} / ${State.mahasiswa.length} mahasiswa`;
}

function showEmptyState(kind, detail = '') {
  if (!DOM.loadingData) return;
  DOM.dataTable.style.display = 'none';
  DOM.loadingData.style.display = 'block';
  DOM.totalMahasiswa.textContent = '0 mahasiswa';

  if (kind === 'offline') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-wifi" style="color:#f87171;font-size:24px;display:block;margin-bottom:12px;"></i>
      <strong style="color:#f87171;">Tidak Ada Koneksi</strong><br><br>
      <span style="color:rgba(255,255,255,0.5);font-size:12px;">Tidak ada internet & tidak ada cache.</span><br><br>
      <button onclick="loadAllData()" style="padding:8px 20px;background:#25d366;color:white;border:none;border-radius:8px;cursor:pointer;">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  } else if (kind === 'empty') {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-info-circle" style="color:#fbbf24;font-size:20px;display:block;margin-bottom:12px;"></i>
      <strong style="color:#fbbf24;">Belum ada data mahasiswa</strong><br><br>
      <span style="color:rgba(255,255,255,0.5);font-size:12px;">Tambahkan data di sheet "Mahasiswa".</span><br><br>
      <a href="${CONFIG.SHEET_URL}" target="_blank" style="padding:8px 20px;background:#25d366;color:white;border:none;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;">
        <i class="fas fa-external-link-alt"></i> Buka Google Sheets
      </a>`;
  } else {
    DOM.loadingData.innerHTML = `
      <i class="fas fa-exclamation-circle" style="color:#ef4444;font-size:24px;display:block;margin-bottom:12px;"></i>
      <strong style="color:#ef4444;">Gagal Memuat Data</strong><br><br>
      <span style="color:rgba(255,255,255,0.5);font-size:12px;">${escapeHtml(detail)}</span><br><br>
      <button onclick="loadAllData()" style="padding:8px 20px;background:#25d366;color:white;border:none;border-radius:8px;cursor:pointer;">
        <i class="fas fa-sync-alt"></i> Coba Lagi
      </button>`;
  }
}

/* ================== QR UMUM ================== */
function generateQR() {
  if (!DOM.qrImage) return;
  const qrData = {
    nim: 'ABSENSI-KELAS',
    nama: 'Presensi Kelas',
    kelas: 'Semua',
    jurusan: 'Semua',
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
}

function downloadQR() {
  if (!DOM.qrImage.src) { alert('QR Code belum siap.'); return; }
  const a = document.createElement('a');
  a.download = 'qr-presensi-kelas.png';
  a.href = DOM.qrImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================== QR PER MAHASISWA ================== */
function generateQRCode() {
  const nim = DOM.qrNimInput.value.trim();
  if (!nim) { showStatus('❌ Masukkan NIM terlebih dahulu', 'error'); DOM.qrNimInput.focus(); return; }
  if (nim.length < 3) { showStatus('❌ NIM minimal 3 karakter', 'error'); return; }

  const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
  if (!mhs) { showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error'); return; }

  const qrData = {
    nim: mhs.nim,
    nama: mhs.nama,
    kelas: mhs.kelas,
    jurusan: mhs.jurusan,
    link_sheet: CONFIG.SHEET_URL,
    timestamp: new Date().toISOString()
  };
  DOM.qrResultImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(qrData))}`;
  DOM.qrInfo.innerHTML = `
    <strong>NIM:</strong> ${escapeHtml(mhs.nim)} &bull;
    <strong>Nama:</strong> ${escapeHtml(mhs.nama)} &bull;
    <strong>Kelas:</strong> ${escapeHtml(mhs.kelas)} &bull;
    <strong>Jurusan:</strong> ${escapeHtml(mhs.jurusan)}
    <div style="margin-top:6px;font-size:12px;color:#25d366;">
      <i class="fas fa-check-circle"></i> Scan QR untuk presensi
    </div>`;
  DOM.qrPreview.classList.add('show');
  showStatus(`✅ QR Code dibuat untuk ${escapeHtml(mhs.nama)} (${escapeHtml(nim)})`, 'success');
}

function downloadQRCode() {
  if (!DOM.qrResultImage.src) { showStatus('❌ Tidak ada QR Code', 'error'); return; }
  const a = document.createElement('a');
  const nim = DOM.qrNimInput.value.trim() || 'mahasiswa';
  a.download = `qr-code-${nim}.png`;
  a.href = DOM.qrResultImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showStatus('✅ QR Code berhasil didownload!', 'success');
}

function closeQRPreview() {
  DOM.qrPreview.classList.remove('show');
  DOM.qrNimInput.value = '';
}

/* ================== SCANNER ================== */
function toggleScanner() {
  if (State.scanning) stopScanner();
  else startScanner();
}

function startScanner() {
  if (State.scanning) return;

  if (State.scanner) {
    try { State.scanner.clear(); } catch {}
    State.scanner = null;
  }

  const readerEl = $('qr-reader');
  if (readerEl) readerEl.innerHTML = '';

  if (DOM.btnStartScan) {
    DOM.btnStartScan.classList.add('stop');
    DOM.btnStartScan.innerHTML = '<i class="fas fa-stop"></i> Stop Scan';
  }

  try {
    State.scanner = new Html5Qrcode("qr-reader", {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE]
    });

    const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
    const onSuccess = (text) => onScanSuccess(text);
    const onError = () => {};

    State.scanner.start({ facingMode: "environment" }, config, onSuccess, onError)
      .then(() => onScannerStarted('📷 Kamera belakang aktif'))
      .catch(() => {
        State.scanner.start({ facingMode: "user" }, config, onSuccess, onError)
          .then(() => onScannerStarted('📷 Kamera depan aktif'))
          .catch(err2 => {
            showStatus('❌ Gagal akses kamera: ' + err2.message, 'error', 0);
            resetScannerButton();
          });
      });
  } catch (err) {
    showStatus('❌ Gagal inisialisasi scanner', 'error', 0);
    resetScannerButton();
  }
}

function onScannerStarted(msg) {
  State.scanning = true;
  if (DOM.scanStatus) DOM.scanStatus.textContent = '🔍 Mendeteksi QR Code...';
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Mendeteksi...';
  showStatus(msg, 'info', 3000);
}

function stopScanner() {
  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => {
        try { State.scanner.clear(); } catch {}
        State.scanner = null;
        State.scanning = false;
        resetScannerButton();
        if (DOM.scanStatus) DOM.scanStatus.textContent = '⏸ Scanner berhenti';
      })
      .catch(() => {});
  } else {
    State.scanning = false;
    resetScannerButton();
  }
}

function resetScannerButton() {
  if (!DOM.btnStartScan) return;
  DOM.btnStartScan.classList.remove('stop');
  DOM.btnStartScan.innerHTML = '<i class="fas fa-play"></i> <span id="btnScanLabel">Mulai Scan</span>';
}

/* ================== SCAN SUCCESS ================== */
function onScanSuccess(decodedText) {
  if (State.processing) return;
  State.processing = true;

  if (State.scanner && State.scanning) {
    State.scanner.stop()
      .then(() => { try { State.scanner.clear(); } catch {} State.scanner = null; State.scanning = false; resetScannerButton(); })
      .catch(() => {});
  }

  processPresensi(decodedText);
}

/* ================== PROSES PRESENSI (INTI) ================== */
async function processPresensi(qrData) {
  const tanggal = todayStr();
  try {
    showStatus('⏳ Memproses presensi...', 'info', 0);

    /* 1) Parse payload */
    let nim = '';
    try {
      const parsed = JSON.parse(qrData);
      nim = String(parsed.nim || '').trim();
    } catch {
      nim = String(qrData || '').trim();
    }

    if (!nim || nim.length < 3) {
      showStatus('❌ NIM tidak valid (minimal 3 karakter)', 'error');
      return;
    }

    /* 2) Cek mahasiswa terdaftar */
    const mhs = State.mahasiswa.find(m => String(m.nim).trim() === nim);
    if (!mhs) {
      showStatus(`❌ NIM ${escapeHtml(nim)} tidak terdaftar!`, 'error');
      return;
    }

    /* 3) Cek duplikat lokal dulu (cepat) */
    if (State.presensiHariIni[nim]) {
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi hari ini!`, 'warning');
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '⚠️ Sudah hadir';
      return;
    }

    /* 4) Kirim ke server (server juga cek duplikat) */
    const payload = {
      nim,
      nama: mhs.nama || '',
      kelas: mhs.kelas || '',
      jurusan: mhs.jurusan || '',
      mataKuliah: 'Presensi Kelas',
      status: 'Hadir'
    };

    let result;
    try {
      result = await apiPost('presensi', payload);
    } catch (netErr) {
      // Offline: simpan lokal + kasih tahu user
      State.presensiHariIni[nim] = { nim, tanggal, offline: true, waktu: new Date().toLocaleString('id-ID') };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`📴 Offline — ${escapeHtml(mhs.nama)} dicatat lokal. Sinkronkan saat online.`, 'warning', 5000);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '📴 Tersimpan lokal';
      return;
    }

    if (result.success) {
      // Sukses → update map & tabel
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.waktu || '', nama: mhs.nama };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`✅ ${escapeHtml(mhs.nama)} HADIR — tersimpan di Google Sheets`, 'success', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '✅ Hadir!';
      if (DOM.presensiStatus) DOM.presensiStatus.textContent = '✅ Hadir';
    } else if (result.already) {
      State.presensiHariIni[nim] = { nim, tanggal, waktu: result.data?.waktu || '' };
      saveCachePresensi(State.presensiHariIni);
      renderDataTable();
      showStatus(`⚠️ ${escapeHtml(mhs.nama)} sudah presensi hari ini (server)`, 'warning', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = '⚠️ Sudah presensi';
    } else {
      showStatus('❌ ' + (result.error || 'Gagal menyimpan presensi'), 'error', 4000);
    }
  } catch (err) {
    console.error(err);
    showStatus('❌ Error: ' + err.message, 'error', 4000);
  } finally {
    setTimeout(() => {
      State.processing = false;
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Arahkan ke QR Code';
      if (!State.scanning) startScanner();
    }, CONFIG.RESCAN_DELAY_MS);
  }
}

/* ================== FLASH ================== */
async function toggleFlash() {
  State.flashOn = !State.flashOn;
  if (!DOM.btnFlash) return;

  if (State.flashOn) {
    DOM.btnFlash.classList.add('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt" style="color:#f1c40f;"></i>';
  } else {
    DOM.btnFlash.classList.remove('active');
    DOM.btnFlash.innerHTML = '<i class="fas fa-bolt"></i>';
  }

  try {
    const video = document.querySelector('#qr-reader video');
    if (!video || !video.srcObject) return;
    const track = video.srcObject.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      await track.applyConstraints({ advanced: [{ torch: State.flashOn }] });
    }
  } catch (e) { /* torch tidak didukung */ }
}

/* ================== IZIN KAMERA ================== */
async function checkCameraPermission() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('❌ Browser tidak mendukung kamera', 'error', 0);
      return false;
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    stream.getTracks().forEach(t => t.stop());
    return true;
  } catch {
    showStatus('❌ Izin kamera diperlukan untuk scan QR Code', 'error', 0);
    return false;
  }
}

/* ================== INIT ================== */
async function init() {
  State.tanggalHariIni = todayStr();

  // Setup link sheet
  const sheetLinkMhs = CONFIG.SHEET_URL + '#gid=' + CONFIG.SHEET_GID_MAHASISWA;
  const sheetLinkPres = CONFIG.SHEET_URL + '#gid=' + CONFIG.SHEET_GID_PRESENSI;
  if ($('sheetLink')) $('sheetLink').href = sheetLinkPres;
  if ($('footerSheetLink')) $('footerSheetLink').href = sheetLinkPres;

  generateQR();
  if (DOM.presensiStatus) DOM.presensiStatus.textContent = 'Menunggu scan...';

  // Load data (cache dulu, lalu server)
  await loadAllData();

  // Auto-refresh tiap 30 detik
  setInterval(() => { loadAllData(); }, CONFIG.REFRESH_INTERVAL_MS);

  // Cek izin kamera & auto-start
  const cameraReady = await checkCameraPermission();
  if (cameraReady) {
    setTimeout(startScanner, 800);
  }
}

document.addEventListener('DOMContentLoaded', init);

window.addEventListener('beforeunload', function () {
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => { try { State.scanner.clear(); } catch {} }).catch(() => {});
  }
});
</script>
