<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Presensi Kelas - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-1: #0f0c29;
            --bg-2: #302b63;
            --bg-3: #24243e;
            --accent: #25d366;
            --accent-dark: #128c7e;
            --text: #ffffff;
            --text-muted: rgba(255,255,255,0.6);
            --card-bg: rgba(255,255,255,0.05);
            --card-border: rgba(255,255,255,0.1);
        }

        body.light-mode {
            --bg-1: #f0f4ff;
            --bg-2: #e0e7ff;
            --bg-3: #dbeafe;
            --text: #1a2a3a;
            --text-muted: rgba(26,42,58,0.6);
            --card-bg: rgba(255,255,255,0.7);
            --card-border: rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-1));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: var(--text);
            transition: background 0.5s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating orbs background */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
        }
        .orb-1 { width: 300px; height: 300px; background: #25d366; top: -100px; left: -100px; }
        .orb-2 { width: 250px; height: 250px; background: #667eea; bottom: -80px; right: -80px; animation-delay: -5s; }
        .orb-3 { width: 200px; height: 200px; background: #f093fb; top: 40%; right: 10%; animation-delay: -10s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 24px 20px 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .clock {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .clock i { color: var(--accent); }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 14px;
        }
        .theme-toggle:hover { background: rgba(37,211,102,0.15); color: var(--accent); transform: rotate(20deg); }

        .icon-circle {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            font-size: 26px; color: white;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4), 0 0 0 8px rgba(37,211,102,0.1);
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 30px rgba(37, 211, 102, 0.4), 0 0 0 8px rgba(37,211,102,0.1); }
            50% { box-shadow: 0 8px 40px rgba(37, 211, 102, 0.6), 0 0 0 12px rgba(37,211,102,0.15); }
        }

        h1 { 
            color: var(--text); 
            font-size: 22px; 
            font-weight: 800; 
            text-align: center; 
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--text), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 16px; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px 8px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-card:hover::before { opacity: 1; }
        .stat-card:hover { transform: translateY(-2px); border-color: rgba(37,211,102,0.3); }
        .stat-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            line-height: 1;
            margin-bottom: 4px;
        }
        .stat-value.green { color: var(--accent); }
        .stat-value.orange { color: #f59e0b; }
        .stat-value.blue { color: #60a5fa; }
        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Progress bar */
        .progress-container {
            margin-bottom: 16px;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #25d366, #128c7e);
            border-radius: 20px;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(37,211,102,0.5);
            position: relative;
            overflow: hidden;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* QR wrapper */
        .qr-wrapper {
            background: white;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .qr-wrapper::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(37,211,102,0.15), transparent 30%);
            animation: rotate 6s linear infinite;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        #qrImage { 
            width: 200px; height: 200px; 
            display: block; border-radius: 8px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }
        .qr-wrapper .qr-label { 
            color: #1a2a3a; font-size: 12px; 
            font-weight: 600; margin-top: 10px;
            position: relative; z-index: 1;
        }

        /* Buttons */
        .btn-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .btn {
            padding: 10px 16px; border: none; border-radius: 12px; font-weight: 600; font-size: 12px;
            cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center;
            gap: 6px; text-decoration: none; flex: 1; justify-content: center;
            position: relative; overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        .btn:active::after { width: 300px; height: 300px; }
        .btn-primary { background: linear-gradient(135deg, #25d366, #128c7e); color: white; box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(37, 211, 102, 0.5); }
        .btn-secondary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3); }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5); }
        .btn-outline { background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); }
        .btn-outline:hover { background: rgba(37,211,102,0.1); border-color: rgba(37,211,102,0.3); transform: translateY(-2px); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3); }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5); }

        .divider {
            display: flex; align-items: center; margin: 16px 0 12px; gap: 12px;
            color: var(--text-muted); font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--card-border); }

        /* Scanner */
        .scanner-area {
            position: relative;
            background: #1a1a2e;
            border-radius: 18px;
            margin-top: 12px;
            min-height: 280px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }
        #qr-reader { width: 100% !important; min-height: 280px; background: #0d0d1a; position: relative; }
        #qr-reader video { width: 100% !important; height: auto !important; border-radius: 0 !important; display: block !important; }
        #qr-reader > div:not(:first-child) { display: none !important; }
        #qr-reader > div:first-child { width: 100% !important; height: auto !important; }
        #qr-reader > div:first-child > div:first-child { width: 100% !important; height: auto !important; }

        .scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .scanner-overlay .scan-frame {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60%; height: 40%;
            border: 2px solid rgba(37, 211, 102, 0.6);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
            transition: all 0.3s;
        }
        .scanner-overlay .scan-frame .corner {
            position: absolute; width: 22px; height: 22px;
            border-color: #25d366; border-style: solid; border-width: 0;
            filter: drop-shadow(0 0 4px rgba(37,211,102,0.8));
        }
        .corner-tl { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-radius: 6px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-radius: 0 6px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-radius: 0 0 0 6px; }
        .corner-br { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-radius: 0 0 6px 0; }
        .scanner-overlay .scan-line {
            position: absolute; top: 30%; left: 20%; right: 20%; height: 2px;
            background: linear-gradient(90deg, transparent, #25d366, #128c7e, transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.6);
        }
        @keyframes scanMove {
            0% { top: 30%; opacity: 0.5; }
            50% { top: 70%; opacity: 1; }
            100% { top: 30%; opacity: 0.5; }
        }
        .scanner-overlay .scan-text {
            position: absolute; bottom: 12px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            font-size: 11px; font-weight: 600;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 16px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 15; white-space: nowrap;
        }
        .scanner-overlay .scan-text i { color: #25d366; font-size: 12px; animation: pulse-icon 1.5s ease-in-out infinite; }
        @keyframes pulse-icon { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .scanner-controls { display: flex; gap: 10px; padding: 12px 0; }
        .scanner-controls button {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-weight: 700; font-size: 13px; cursor: pointer;
            transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-scan { background: linear-gradient(135deg, #25d366 0%, #128c7e 100%); color: white; box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4); }
        .btn-scan:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37, 211, 102, 0.6); }
        .btn-scan.stop { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 4px 16px rgba(231, 76, 60, 0.4); animation: pulseStop 1.5s ease-in-out infinite; }
        @keyframes pulseStop {
            0%, 100% { box-shadow: 0 4px 16px rgba(231, 76, 60, 0.4); }
            50% { box-shadow: 0 4px 24px rgba(231, 76, 60, 0.7); }
        }
        .btn-flash { background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); flex: 0.4; }
        .btn-flash:hover { background: rgba(255,255,255,0.15); }
        .btn-flash.active { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #2c3e50; border-color: #f1c40f; box-shadow: 0 0 20px rgba(241,196,15,0.5); }

        /* Toast */
        #status {
            padding: 12px 16px; border-radius: 14px;
            font-weight: 600; font-size: 13px;
            display: none; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            align-items: center; gap: 10px; margin-top: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border-left: 4px solid;
        }
        #status i { font-size: 16px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        #status.success { display: flex; background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; border-left-color: #10b981; }
        #status.error { display: flex; background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; border-left-color: #ef4444; }
        #status.info { display: flex; background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; border-left-color: #3b82f6; }
        #status.warning { display: flex; background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border-left-color: #f59e0b; }

        /* Data section */
        .data-section {
            margin-top: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
        }
        .data-section .data-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.15), rgba(37, 211, 102, 0.05));
            border-bottom: 2px solid rgba(37, 211, 102, 0.2);
            display: flex; justify-content: space-between; align-items: center;
        }
        .data-section .data-header .title {
            color: var(--text); font-size: 14px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
        }
        .data-section .data-header .title i { color: #25d366; }
        .data-section .data-header .count {
            color: var(--text-muted); font-size: 11px;
            background: var(--card-bg);
            padding: 3px 12px; border-radius: 20px;
            font-weight: 600;
        }
        .data-section .table-wrapper { max-height: 240px; overflow-y: auto; }
        .data-section .table-wrapper::-webkit-scrollbar { width: 4px; }
        .data-section .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .data-section .table-wrapper::-webkit-scrollbar-thumb { background: rgba(37, 211, 102, 0.4); border-radius: 4px; }
        .data-section table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-section table th {
            padding: 8px 10px; text-align: left;
            color: var(--text-muted);
            font-weight: 700; font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--card-border);
            position: sticky; top: 0;
            background: var(--bg-1);
            backdrop-filter: blur(8px);
        }
        body.light-mode .data-section table th { background: #e0e7ff; }
        .data-section table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text);
        }
        .data-section table tr { transition: background 0.2s; }
        .data-section table tr:hover td { background: rgba(37,211,102,0.05); }
        .data-section table .status-hadir { color: #25d366; font-weight: 700; }
        .data-section table .status-belum { color: var(--text-muted); }

        .footer-note {
            margin-top: 16px; font-size: 11px;
            color: var(--text-muted); text-align: center;
            line-height: 1.6;
        }
        .footer-note i { color: #25d366; }
        .footer-note a { color: #25d366; text-decoration: none; font-weight: 600; }
        .footer-note a:hover { text-decoration: underline; }

        .loading-text {
            text-align: center; padding: 24px;
            color: var(--text-muted); font-size: 13px;
        }
        .loading-text i { margin-right: 8px; }

        .connection-status {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 12px; border-radius: 20px;
            font-size: 10px; font-weight: 600;
            background: var(--card-bg);
            margin-top: 8px; justify-content: center;
            border: 1px solid var(--card-border);
        }
        .connection-status .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .connection-status .dot.online { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        .connection-status .dot.offline { background: #f87171; animation: pulse-red 1s ease-in-out infinite; }
        .connection-status .dot.checking { background: #fbbf24; animation: pulse-yellow 0.8s ease-in-out infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; box-shadow: 0 0 8px #f87171; } 50% { opacity: 0.3; box-shadow: none; } }
        @keyframes pulse-yellow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* QR generate section */
        .qr-generate-section { padding: 12px 0 8px 0; }
        .qr-generate-section .qr-label {
            font-size: 13px; font-weight: 700;
            color: var(--text);
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 10px;
        }
        .qr-generate-section .qr-label i { color: #25d366; }
        .qr-generate-section .qr-input-group { display: flex; gap: 10px; }
        .qr-generate-section .qr-input-group input {
            flex: 1; padding: 12px 14px;
            border: 2px solid var(--card-border);
            border-radius: 12px; font-size: 14px;
            background: var(--card-bg);
            color: var(--text); transition: all 0.3s;
            font-weight: 600;
        }
        .qr-generate-section .qr-input-group input:focus {
            outline: none; border-color: #25d366;
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15);
        }
        .qr-generate-section .qr-input-group input::placeholder { color: var(--text-muted); font-weight: 400; }
        .qr-generate-section .qr-input-group button {
            padding: 12px 18px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white; border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer; font-size: 13px;
            transition: all 0.25s ease; white-space: nowrap;
        }
        .qr-generate-section .qr-input-group button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); }

        .qr-preview {
            margin-top: 12px; padding: 16px;
            background: var(--card-bg);
            border-radius: 14px; border: 1px solid var(--card-border);
            text-align: center; display: none;
        }
        .qr-preview.show { display: block !important; animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .qr-preview img {
            max-width: 180px; height: auto;
            border-radius: 8px; background: white; padding: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .qr-preview .qr-info { margin-top: 10px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
        .qr-preview .qr-info strong { color: var(--text); }
        .qr-preview .qr-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; }
        .qr-preview .qr-actions button {
