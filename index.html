<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Presensi Neo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root {
    --c1:#6366f1; --c2:#8b5cf6; --c3:#ec4899; --c4:#14b8a6; --c5:#f59e0b;
    --ink:#0f172a; --ink2:#1e293b; --paper:#f8fafc;
    --glass:rgba(255,255,255,0.7);
    --glass-border:rgba(255,255,255,0.9);
    --shadow:0 8px 32px rgba(15,23,42,0.08);
    --shadow-lg:0 20px 60px rgba(15,23,42,0.12);
    --radius:24px;
  }

  body.dark {
    --ink:#f8fafc; --ink2:#e2e8f0; --paper:#0f172a;
    --glass:rgba(30,41,59,0.7);
    --glass-border:rgba(255,255,255,0.1);
    --shadow:0 8px 32px rgba(0,0,0,0.4);
    --shadow-lg:0 20px 60px rgba(0,0,0,0.6);
  }

  html, body { height:100%; overflow-x:hidden; }

  body {
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    transition:background 0.5s, color 0.5s;
    position:relative;
    padding-bottom:90px;
    min-height:100vh;
  }

  /* ============ MESH GRADIENT BG ============ */
  .mesh {
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(at 20% 10%, #a78bfa 0px, transparent 50%),
      radial-gradient(at 80% 0%, #f472b6 0px, transparent 50%),
      radial-gradient(at 0% 50%, #34d399 0px, transparent 50%),
      radial-gradient(at 80% 80%, #60a5fa 0px, transparent 50%),
      radial-gradient(at 0% 100%, #fbbf24 0px, transparent 50%);
    filter:blur(60px) saturate(1.4);
    opacity:0.55;
    animation:meshMove 20s ease-in-out infinite;
    transition:opacity 0.5s;
  }
  body.dark .mesh { opacity:0.35; }
  @keyframes meshMove {
    0%, 100% { transform:scale(1) rotate(0deg); }
    50% { transform:scale(1.15) rotate(5deg); }
  }

  /* ============ CONTAINER ============ */
  .app {
    max-width:480px;
    margin:0 auto;
    padding:0 16px;
    position:relative;
  }

  /* ============ WAVE HEADER ============ */
  .wave-header {
    position:relative;
    margin:0 -16px 0;
    padding:24px 16px 0;
    color:white;
    overflow:hidden;
    border-radius:0 0 36px 36px;
    box-shadow:var(--shadow-lg);
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
    animation:headerIn 0.9s cubic-bezier(0.16,1,0.3,1);
  }
  body.dark .wave-header {
    background:linear-gradient(135deg,#312e81 0%,#4c1d95 50%,#831843 100%);
  }
  @keyframes headerIn {
    from { opacity:0; transform:translateY(-40px); }
    to { opacity:1; transform:translateY(0); }
  }

  .wave-header::before {
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 90% 10%, rgba(255,255,255,0.3), transparent 40%),
      radial-gradient(circle at 10% 90%, rgba(255,255,255,0.2), transparent 40%);
    pointer-events:none;
  }

  .top-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:2;
    margin-bottom:16px;
  }

  .avatar-brand {
    display:flex;
    align-items:center;
    gap:12px;
  }
  .avatar {
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    border:2px solid rgba(255,255,255,0.5);
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
    animation:avatarFloat 3s ease-in-out infinite;
  }
  @keyframes avatarFloat {
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-4px); }
  }
  .brand-name {
    font-size:16px;
    font-weight:800;
    letter-spacing:-0.3px;
    line-height:1.1;
  }
  .brand-sub {
    font-size:10px;
    opacity:0.8;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .theme-btn {
    width:40px; height:40px;
    border-radius:12px;
    background:rgba(255,255,255,0.2);
    border:1px solid rgba(255,255,255,0.3);
    color:white;
    cursor:pointer;
    font-size:15px;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.3s;
    backdrop-filter:blur(10px);
  }
  .theme-btn:hover { background:rgba(255,255,255,0.35); transform:rotate(180deg); }

  /* Wave SVG */
  .wave-svg {
    position:absolute;
    bottom:-2px; left:0; right:0;
    width:100%;
    height:60px;
    z-index:1;
  }
  .wave-svg path {
    fill:var(--paper);
    transition:fill 0.5s;
  }

  /* ============ CLOCK CARD ============ */
  .clock-card {
    position:relative;
    z-index:3;
    margin:20px 0 24px;
    padding:16px 20px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.25);
    display:flex;
    align-items:center;
    justify-content:space-between;
    animation:clockIn 1s 0.3s backwards cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes clockIn {
    from { opacity:0; transform:scale(0.9); }
    to { opacity:1; transform:scale(1); }
  }
  .clock-date {
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .clock-date i { font-size:14px; }
  .clock-num {
    font-size:26px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    letter-spacing:1px;
    text-shadow:0 2px 12px rgba(0,0,0,0.15);
  }

  /* ============ BENTO STATS GRID ============ */
  .bento {
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr;
    grid-template-rows:auto auto;
    gap:12px;
    margin-bottom:20px;
    animation:bentoIn 0.8s 0.4s backwards cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes bentoIn {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
  }

  .bento-cell {
    background:var(--glass);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);
    border-radius:20px;
    padding:14px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
    animation:cellIn 0.6s backwards cubic-bezier(0.16,1,0.3,1);
  }
  .bento-cell:nth-child(1) { animation-delay:0.5s; }
  .bento-cell:nth-child(2) { animation-delay:0.6s; }
  .bento-cell:nth-child(3) { animation-delay:0.7s; }
  @keyframes cellIn {
    from { opacity:0; transform:translateY(20px) scale(0.9); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  .bento-cell:hover {
    transform:translateY(-4px) scale(1.02);
    box-shadow:var(--shadow-lg);
  }

  .bento-cell.main {
    grid-row:span 2;
    background:linear-gradient(135deg,rgba(20,184,166,0.15),rgba(99,102,241,0.15));
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
  }
  .bento-cell.main::before {
    content:'';
    position:absolute;
    top:-30%; right:-30%;
    width:150px; height:150px;
    background:radial-gradient(circle,rgba(99,102,241,0.4),transparent 70%);
    border-radius:50%;
    animation:orbRotate 8s linear infinite;
  }
  @keyframes orbRotate {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  .bento-icon {
    width:38px; height:38px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    color:white;
    margin-bottom:10px;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
    position:relative;
    z-index:1;
  }
  .bento-icon.green { background:linear-gradient(135deg,#14b8a6,#0891b2); }
  .bento-icon.orange { background:linear-gradient(135deg,#f59e0b,#ea580c); }
  .bento-icon.blue { background:linear-gradient(135deg,#6366f1,#8b5cf6); }

  .bento-num {
    font-size:32px;
    font-weight:900;
    line-height:1;
    letter-spacing:-1px;
    position:relative;
    z-index:1;
    background:linear-gradient(135deg,var(--ink),var(--c1));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .bento-num.small {
    font-size:22px;
    margin-bottom:6px;
  }

  .bento-label {
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink2);
    opacity:0.6;
    margin-top:6px;
    position:relative;
    z-index:1;
  }

  /* ============ MAIN CARD ============ */
  .card-new {
    background:var(--glass);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
    animation:cardIn 0.8s backwards cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(24px); }
    to { opacity:1; transform:translateY(0); }
  }

  .card-head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .card-head-left {
    display:flex;
    align-items:center;
    gap:10px;
  }
  .card-dot {
    width:8px; height:8px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--c4),var(--c1));
    box-shadow:0 0 12px var(--c4);
    animation:pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform:scale(1); opacity:1; }
    50% { transform:scale(1.4); opacity:0.6; }
  }
  .card-head-title {
    font-size:13px;
    font-weight:800;
    letter-spacing:0.3px;
  }
  .card-pill {
    font-size:9px;
    font-weight:800;
    padding:5px 11px;
    border-radius:20px;
    background:linear-gradient(135deg,var(--c1),var(--c2));
    color:white;
    letter-spacing:0.5px;
    text-transform:uppercase;
    box-shadow:0 4px 12px rgba(99,102,241,0.3);
  }

  /* ============ SCANNER ============ */
  .scan-wrap {
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:#000;
    min-height:300px;
    box-shadow:inset 0 0 60px rgba(0,0,0,0.8);
    animation:scanIn 1s 0.6s backwards cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes scanIn {
    from { opacity:0; transform:scale(0.95); }
    to { opacity:1; transform:scale(1); }
  }

  #qr-reader {
    width:100% !important;
    min-height:300px;
    background:#000;
  }
  #qr-reader video {
    width:100% !important;
    height:auto !important;
    display:block !important;
    border-radius:0 !important;
  }
  #qr-reader > div:not(:first-child) { display:none !important; }
  #qr-reader > div:first-child,
  #qr-reader > div:first-child > div:first-child {
    width:100% !important;
    height:auto !important;
  }

  .scan-frame-neo {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:65%;
    aspect-ratio:1;
    pointer-events:none;
    z-index:5;
  }

  .frame-border {
    position:absolute;
    inset:0;
    border-radius:20px;
    box-shadow:
      0 0 0 4000px rgba(0,0,0,0.65),
      inset 0 0 40px rgba(99,102,241,0.3);
  }

  .frame-corner {
    position:absolute;
    width:32px; height:32px;
    border-color:#fff;
    border-style:solid;
    border-width:0;
    filter:drop-shadow(0 0 12px rgba(255,255,255,0.9));
  }
  .fc-tl { top:0; left:0; border-top-width:5px; border-left-width:5px; border-radius:20px 0 0 0; }
  .fc-tr { top:0; right:0; border-top-width:5px; border-right-width:5px; border-radius:0 20px 0 0; }
  .fc-bl { bottom:0; left:0; border-bottom-width:5px; border-left-width:5px; border-radius:0 0 0 20px; }
  .fc-br { bottom:0; right:0; border-bottom-width:5px; border-right-width:5px; border-radius:0 0 20px 0; }

  .scan-laser-neo {
    position:absolute;
    left:4px; right:4px;
    height:3px;
    background:linear-gradient(90deg,transparent,#fff,#6366f1,#fff,transparent);
    border-radius:3px;
    box-shadow:0 0 24px rgba(99,102,241,1), 0 0 60px rgba(99,102,241,0.6);
    animation:laserMove 2.5s ease-in-out infinite;
  }
  @keyframes laserMove {
    0%,100% { top:4px; opacity:0.5; }
    50% { top:calc(100% - 8px); opacity:1; }
  }

  .scan-badge {
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 16px;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(12px);
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    color:#fff;
    border:1px solid rgba(255,255,255,0.15);
    z-index:10;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  .scan-badge i { color:#14b8a6; font-size:10px; animation:blink 1.2s infinite; }
  @keyframes blink {
    0%,100% { opacity:1; } 50% { opacity:0.3; }
  }

  /* ============ BUTTONS ============ */
  .btn-row {
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .btn-neo {
    flex:1;
    padding:14px 18px;
    border:none;
    border-radius:16px;
    font-family:inherit;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
    position:relative;
    overflow:hidden;
    letter-spacing:0.3px;
  }
  .btn-neo:active { transform:scale(0.96); }

  .btn-neo.primary {
    background:linear-gradient(135deg,var(--c4),var(--c1));
    color:white;
    box-shadow:0 8px 24px rgba(20,184,166,0.4);
  }
  .btn-neo.primary:hover {
    transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(20,184,166,0.6);
  }
  .btn-neo.primary.stop {
    background:linear-gradient(135deg,#ef4444,#dc2626);
    box-shadow:0 8px 24px rgba(239,68,68,0.4);
    animation:stopBlink 1.2s infinite;
  }
  @keyframes stopBlink {
    0%,100% { box-shadow:0 8px 24px rgba(239,68,68,0.4); }
    50% { box-shadow:0 8px 32px rgba(239,68,68,0.8); }
  }

  .btn-neo.icon-only {
    flex:0 0 60px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    color:var(--ink);
  }
  .btn-neo.icon-only.active {
    background:linear-gradient(135deg,#f59e0b,#ea580c);
    color:white;
    box-shadow:0 8px 24px rgba(245,158,11,0.5);
  }

  /* ============ QR CODE ============ */
  .qr-box-neo {
    padding:20px;
    border-radius:20px;
    background:linear-gradient(135deg,#ffffff,#f0f4ff);
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.15);
  }
  .qr-box-neo::before {
    content:'';
    position:absolute;
    top:-50%; left:-50%;
    width:200%; height:200%;
    background:conic-gradient(from 0deg,transparent 0deg,#6366f1 90deg,transparent 180deg,#ec4899 270deg,transparent 360deg);
    opacity:0.15;
    animation:qrRot 6s linear infinite;
  }
  @keyframes qrRot { to { transform:rotate(360deg); } }

  .qr-box-neo img {
    position:relative;
    z-index:1;
    width:190px;
    height:190px;
    border-radius:12px;
    background:white;
    padding:8px;
  }

  .qr-info-neo {
    position:relative;
    z-index:1;
    margin-top:12px;
    font-size:11px;
    font-weight:700;
    color:#334155;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .qr-info-neo i { color:#14b8a6; }

  /* ============ INPUT ============ */
  .input-neo {
    display:flex;
    gap:10px;
  }
  .input-neo input {
    flex:1;
    padding:14px 16px;
    border:2px solid var(--glass-border);
    border-radius:16px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    background:rgba(255,255,255,0.5);
    color:var(--ink);
    transition:all 0.3s;
  }
  body.dark .input-neo input { background:rgba(0,0,0,0.3); }
  .input-neo input:focus {
    outline:none;
    border-color:var(--c1);
    box-shadow:0 0 0 4px rgba(99,102,241,0.15);
    background:white;
  }
  body.dark .input-neo input:focus { background:rgba(0,0,0,0.5); }
  .input-neo input::placeholder { color:var(--ink2); opacity:0.5; font-weight:500; }

  .input-neo button {
    padding:14px 22px;
    background:linear-gradient(135deg,var(--c2),var(--c3));
    color:white;
    border:none;
    border-radius:16px;
    font-family:inherit;
    font-weight:800;
    font-size:13px;
    cursor:pointer;
    transition:all 0.25s;
    box-shadow:0 8px 24px rgba(139,92,246,0.4);
    white-space:nowrap;
  }
  .input-neo button:hover {
    transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(139,92,246,0.6);
  }

  /* ============ QR PREVIEW ============ */
  .qr-prev-neo {
    margin-top:14px;
    padding:18px;
    border-radius:18px;
    background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(236,72,153,0.08));
    border:1px dashed rgba(99,102,241,0.4);
    text-align:center;
    display:none;
  }
  .qr-prev-neo.show {
    display:block;
    animation:prevIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes prevIn {
    from { opacity:0; transform:scale(0.8) rotate(-5deg); }
    to { opacity:1; transform:scale(1) rotate(0); }
  }
  .qr-prev-neo img {
    max-width:170px;
    border-radius:12px;
    background:white;
    padding:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.15);
  }
  .qr-prev-neo .info {
    margin-top:10px;
    font-size:12px;
    color:var(--ink2);
    line-height:1.7;
    font-weight:500;
  }
  .qr-prev-neo .info strong { color:var(--ink); font-weight:800; }
  .qr-prev-neo .actions {
    margin-top:12px;
    display:flex;
    gap:8px;
    justify-content:center;
  }
  .qr-prev-neo .actions button {
    padding:9px 20px;
    border:none;
    border-radius:12px;
    font-weight:800;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    gap:6px;
    transition:all 0.2s;
  }
  .qr-prev-neo .actions .dl {
    background:linear-gradient(135deg,#14b8a6,#0891b2);
    color:white;
  }
  .qr-prev-neo .actions .cls {
    background:rgba(0,0,0,0.1);
    color:var(--ink);
  }

  /* ============ TABLE ============ */
  .table-neo {
    max-height:360px;
    overflow-y:auto;
    border-radius:16px;
  }
  .table-neo::-webkit-scrollbar { width:6px; }
  .table-neo::-webkit-scrollbar-track { background:transparent; }
  .table-neo::-webkit-scrollbar-thumb {
    background:linear-gradient(180deg,var(--c1),var(--c3));
    border-radius:4px;
  }
  .table-neo table {
    width:100%;
    border-collapse:separate;
    border-spacing:0 8px;
  }
  .table-neo thead th {
    padding:8px 12px;
    text-align:left;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink2);
    opacity:0.6;
    font-weight:800;
  }
  .table-neo tbody tr {
    background:rgba(255,255,255,0.5);
    transition:all 0.25s;
  }

  #status {

  #status.success { display:flex; background:linear-gradient(135deg,rgba(20,184,166,0.95),rgba(16,185,129,0.95)); color:white; }

<div class="app">

<script>
/* ================================================================
   PRESENSI NEO — Complete Redesign
   ================================================================ */

const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwFaiXWeQmp9D1U6YKlNM2u28Dgp8mcnYmzWxoWXH_FS3Po3oWJt1-kknsCZ_yRDranPQ/exec',
  SHEET_URL: 'https://docs.google.com/spreadsheets/d/1PXOSZAXZNg7hvX-33DglZlM3saj4yclUhiYepiFNYhI/edit?gid=0#gid=0',
  SHEET_GID_PRESENSI: '646034675',
  CK_MHS: 'presensi_mhs_v4',
  CK_PRS: 'presensi_prs_v4',
  CK_THEME: 'presensi_theme_v4',
  REFRESH_MS: 30000,
  RESCAN_MS: 2500
};

const State = {
  scanner:null, scanning:false, flashOn:false, processing:false,
  mahasiswa:[], presensiHariIni:{}, isOnline:false, tanggalHariIni:''
};

const $ = id => document.getElementById(id);
const DOM = {
  status:$('status'), scanStatus:$('scanStatusText'),
  btnStartScan:$('btnStartScan'), btnFlash:$('btnFlash'),
  qrImage:$('qrImage'), tableBody:$('tableBody'),
  dataTable:$('dataTable'), loadingData:$('loadingData'),
  totalMahasiswa:$('totalMahasiswa'), statusDot:$('statusDot'),
  statusLabel:$('statusLabel'), qrNimInput:$('qrNimInput'),
  qrResultImage:$('qrResultImage'), qrInfo:$('qrInfo'),
  qrPreview:$('qrPreview'), scannerArea:$('scannerArea')
};

/* ============ VIEW SWITCHER ============ */
function switchView(view, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  $('view-' + view).classList.add('active');
  btn.classList.add('active');
  if (view === 'scan' && !State.scanning) {
    setTimeout(() => { try { startScanner(); } catch(e){} }, 250);
  } else if (view !== 'scan' && State.scanning) {
    stopScanner();
  }
}

/* ============ SOUND ============ */
let audioCtx = null;
function beep(type = 'ok') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (type === 'ok') {
      o.frequency.setValueAtTime(660, audioCtx.currentTime);
      o.frequency.setValueAtTime(990, audioCtx.currentTime + 0.1);
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
      o.start(); o.stop(audioCtx.currentTime + 0.35);
    } else {
      o.frequency.value = 220;
      g.gain.setValueAtTime(0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    }
  } catch(e){}
}

/* ============ CONFETTI ============ */
function confetti() {
  const colors = ['#6366f1','#8b5cf6','#ec4899','#14b8a6','#f59e0b','#10b981'];
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'cf';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      const s = (Math.random() * 8 + 6) + 'px';
      c.style.width = s; c.style.height = s;
      c.style.animation = `cfFall ${Math.random()*1.5+1.5}s linear forwards`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3200);
    }, i * 18);
  }
}

/* ============ UTILS ============ */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function setConn(st, msg) {
  if (!DOM.statusDot) return;
  DOM.statusDot.className = 'conn-dot ' + st;
  DOM.statusLabel.textContent = msg;
  State.isOnline = (st === 'online');
}

let tmr;
function toast(msg, type='info', dur=4000) {
  if (!DOM.status) return;
  const ic = {success:'fa-circle-check',error:'fa-circle-exclamation',warning:'fa-triangle-exclamation',info:'fa-circle-info'};
  DOM.status.innerHTML = `<i class="fas ${ic[type]||ic.info}"></i><span>${msg}</span>`;
  DOM.status.className = type;
  DOM.status.style.display = 'flex';
  clearTimeout(tmr);
  if (dur > 0) tmr = setTimeout(() => DOM.status.style.display = 'none', dur);
}

/* ============ API ============ */
async function apiGet(action, params={}) {
  const qs = new URLSearchParams({action, t:Date.now(), ...params});
  const r = await fetch(CONFIG.API_URL + '?' + qs, {method:'GET', redirect:'follow'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiPost(action, payload={}) {
  const r = await fetch(CONFIG.API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action, ...payload})
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ============ CACHE ============ */
function loadMhsCache() { try { const r = localStorage.getItem(CONFIG.CK_MHS); return r?JSON.parse(r):[]; } catch { return []; } }
function saveMhsCache(d) { try { localStorage.setItem(CONFIG.CK_MHS, JSON.stringify(d)); } catch {} }
function loadPrsCache() {
  try {
    const r = localStorage.getItem(CONFIG.CK_PRS);
    if (!r) return null;
    const p = JSON.parse(r);
    if (p.tanggal !== todayStr()) return null;
    return p.map || {};
  } catch { return null; }
}
function savePrsCache(map) { try { localStorage.setItem(CONFIG.CK_PRS, JSON.stringify({tanggal:todayStr(), map})); } catch {} }

/* ============ CONNECTION ============ */
async function checkConn() {
  setConn('checking', 'Mengecek...');
  try {
    const j = await apiGet('ping');
    if (j.success) { setConn('online', 'Terhubung'); return true; }
    throw new Error('fail');
  } catch { setConn('offline', 'Offline'); return false; }
}

/* ============ LOAD DATA ============ */
async function loadAllData() {
  State.tanggalHariIni = todayStr();
  const cached = loadMhsCache();
  if (cached.length) {
    State.mahasiswa = cached;
    State.presensiHariIni = loadPrsCache() || {};
    renderTable();
  } else {
    if (DOM.loadingData) DOM.loadingData.style.display = 'block';
    if (DOM.dataTable) DOM.dataTable.style.display = 'none';
  }

  const online = await checkConn();
  if (!online) {
    if (!cached.length) showEmpty('offline');
    else toast('📂 Mode offline — pakai cache', 'warning', 3000);
    return;
  }

  try {
    const m = await apiGet('get_all');
    if (m.success && Array.isArray(m.data)) {
      State.mahasiswa = m.data;
      saveMhsCache(m.data);
    }
    const p = await apiGet('get_presensi', {tanggal:todayStr()});
    if (p.success && Array.isArray(p.data)) {
      const map = {};
      p.data.forEach(x => { if (x.nim) map[String(x.nim).trim()] = x; });
      State.presensiHariIni = map;
      savePrsCache(map);
    }
    renderTable();
    toast(`${State.mahasiswa.length} mahasiswa · ${Object.keys(State.presensiHariIni).length} hadir`, 'success', 2500);
  } catch (err) {
    if (State.mahasiswa.length) { toast('⚠️ Gagal sinkron — pakai cache', 'warning', 3500); renderTable(); }
    else showEmpty('error', err.message);
  }
}

/* ============ STATS ============ */
function updateStats() {
  const total = State.mahasiswa.length;
  const hadir = Object.keys(State.presensiHariIni).length;
  const belum = Math.max(0, total - hadir);
  if ($('statHadir')) $('statHadir').textContent = hadir;
  if ($('statBelum')) $('statBelum').textContent = belum;
  if ($('statTotal')) $('statTotal').textContent = total;
}

/* ============ RENDER ============ */
function renderTable() {
  if (!DOM.tableBody || !DOM.dataTable || !DOM.loadingData) return;
  DOM.tableBody.innerHTML = '';
  if (!State.mahasiswa.length) { showEmpty('empty'); updateStats(); return; }

  State.mahasiswa.forEach(m => {
    const nim = String(m.nim || '').trim();
    const hadir = !!State.presensiHariIni[nim];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="nim-badge">${esc(nim||'-')}</span></td>
      <td>${esc(m.nama||'-')}</td>
      <td>${esc(m.kelas||'-')}</td>
      <td>${hadir ? '<span class="pill-h"><i class="fas fa-check"></i>Hadir</span>' : '<span class="pill-b"><i class="fas fa-clock"></i>Belum</span>'}</td>`;
    DOM.tableBody.appendChild(tr);
  });

  DOM.loadingData.style.display = 'none';
  DOM.dataTable.style.display = 'table';
  DOM.totalMahasiswa.textContent = `${Object.keys(State.presensiHariIni).length}/${State.mahasiswa.length}`;
  updateStats();
}

function showEmpty(kind, detail='') {
  if (!DOM.loadingData) return;
  DOM.dataTable.style.display = 'none';
  DOM.loadingData.style.display = 'block';
  updateStats();
  if (kind === 'offline') {
    DOM.loadingData.innerHTML = `<i class="fas fa-wifi" style="color:#ef4444;font-size:32px;display:block;margin-bottom:14px;"></i><strong>Tidak Ada Koneksi</strong><br><span style="font-size:12px;opacity:0.6;display:block;margin-top:8px;">Tidak ada internet & tidak ada cache.</span><button onclick="loadAllData()" style="margin-top:14px;padding:10px 22px;background:linear-gradient(135deg,#14b8a6,#0891b2);color:white;border:none;border-radius:12px;cursor:pointer;font-weight:800;font-family:inherit;"><i class="fas fa-sync-alt"></i> Coba Lagi</button>`;
  } else if (kind === 'empty') {
    DOM.loadingData.innerHTML = `<i class="fas fa-inbox" style="color:#f59e0b;font-size:32px;display:block;margin-bottom:14px;"></i><strong>Belum Ada Data</strong><br><span style="font-size:12px;opacity:0.6;display:block;margin-top:8px;">Tambahkan data di sheet "Mahasiswa".</span><a href="${CONFIG.SHEET_URL}" target="_blank" style="display:inline-block;margin-top:14px;padding:10px 22px;background:linear-gradient(135deg,#14b8a6,#0891b2);color:white;border-radius:12px;text-decoration:none;font-weight:800;"><i class="fas fa-external-link-alt"></i> Buka Sheet</a>`;
  } else {
    DOM.loadingData.innerHTML = `<i class="fas fa-circle-exclamation" style="color:#ef4444;font-size:32px;display:block;margin-bottom:14px;"></i><strong>Gagal Memuat</strong><br><span style="font-size:12px;opacity:0.6;display:block;margin-top:8px;">${esc(detail)}</span><button onclick="loadAllData()" style="margin-top:14px;padding:10px 22px;background:linear-gradient(135deg,#14b8a6,#0891b2);color:white;border:none;border-radius:12px;cursor:pointer;font-weight:800;font-family:inherit;"><i class="fas fa-sync-alt"></i> Coba Lagi</button>`;
  }
}

/* ============ QR ============ */
function generateQR() {
  if (!DOM.qrImage) return;
  const data = {
    nim:'ABSENSI-KELAS', nama:'Presensi Kelas', kelas:'Semua',
    jurusan:'Semua', link_sheet:CONFIG.SHEET_URL,
    timestamp:new Date().toISOString()
  };
  DOM.qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(data))}`;
}
function downloadQR() {
  if (!DOM.qrImage.src) { alert('QR belum siap'); return; }
  const a = document.createElement('a');
  a.download = 'qr-presensi-neo.png'; a.href = DOM.qrImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function generateQRCode() {
  const nim = DOM.qrNimInput.value.trim();
  if (!nim) { toast('Masukkan NIM dulu', 'error'); DOM.qrNimInput.focus(); return; }
  if (nim.length < 3) { toast('NIM minimal 3 karakter', 'error'); return; }
  const m = State.mahasiswa.find(x => String(x.nim).trim() === nim);
  if (!m) { toast(`NIM ${esc(nim)} tidak terdaftar`, 'error'); return; }
  const data = { nim:m.nim, nama:m.nama, kelas:m.kelas, jurusan:m.jurusan, link_sheet:CONFIG.SHEET_URL, timestamp:new Date().toISOString() };
  DOM.qrResultImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(JSON.stringify(data))}`;
  DOM.qrInfo.innerHTML = `<strong>${esc(m.nim)}</strong> · ${esc(m.nama)}<br>${esc(m.kelas)} · ${esc(m.jurusan)}<div style="margin-top:6px;color:#14b8a6;font-weight:800;font-size:11px;"><i class="fas fa-check-circle"></i> Siap discan</div>`;
  DOM.qrPreview.classList.add('show');
  toast(`QR dibuat untuk ${esc(m.nama)}`, 'success');
}
function downloadQRCode() {
  if (!DOM.qrResultImage.src) { toast('Tidak ada QR', 'error'); return; }
  const a = document.createElement('a');
  const nim = DOM.qrNimInput.value.trim() || 'mhs';
  a.download = `qr-${nim}.png`; a.href = DOM.qrResultImage.src;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('QR berhasil didownload', 'success');
}
function closeQRPreview() {
  DOM.qrPreview.classList.remove('show');
  DOM.qrNimInput.value = '';
}

/* ============ SCANNER ============ */
function toggleScanner() { State.scanning ? stopScanner() : startScanner(); }

function startScanner() {
  if (State.scanning) return;
  if (State.scanner) { try { State.scanner.clear(); } catch {} State.scanner = null; }
  const el = $('qr-reader'); if (el) el.innerHTML = '';
  if (DOM.btnStartScan) {
    DOM.btnStartScan.classList.add('stop');
    DOM.btnStartScan.innerHTML = '<i class="fas fa-stop"></i> <span>Stop</span>';
  }
  try {
    State.scanner = new Html5Qrcode("qr-reader", { verbose:false, formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE] });
    const cfg = { fps:10, qrbox:{width:250,height:250}, aspectRatio:1.0 };
    State.scanner.start({facingMode:"environment"}, cfg, onScan, ()=>{})
      .then(() => onStarted('📷 Kamera aktif'))
      .catch(() => {
        State.scanner.start({facingMode:"user"}, cfg, onScan, ()=>{})
          .then(() => onStarted('📷 Kamera depan'))
          .catch(e => { toast('Gagal akses kamera', 'error', 0); resetBtn(); });
      });
  } catch { toast('Gagal inisialisasi scanner', 'error', 0); resetBtn(); }
}
function onStarted(msg) {
  State.scanning = true;
  if (DOM.scanStatus) DOM.scanStatus.textContent = 'Mendeteksi QR...';
  toast(msg, 'info', 2500);
}
function stopScanner() {
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => {
      try { State.scanner.clear(); } catch {}
      State.scanner = null; State.scanning = false;
      resetBtn();
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Scanner berhenti';
    }).catch(()=>{});
  } else { State.scanning = false; resetBtn(); }
}
function resetBtn() {
  if (!DOM.btnStartScan) return;
  DOM.btnStartScan.classList.remove('stop');
  DOM.btnStartScan.innerHTML = '<i class="fas fa-play"></i> <span>Mulai Scan</span>';
}

/* ============ ON SCAN ============ */
function onScan(text) {
  if (State.processing) return;
  State.processing = true;
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => {
      try { State.scanner.clear(); } catch {}
      State.scanner = null; State.scanning = false; resetBtn();
    }).catch(()=>{});
  }
  processPresensi(text);
}

/* ============ PROSES ============ */
async function processPresensi(qr) {
  const tgl = todayStr();
  try {
    toast('Memproses...', 'info', 0);
    let nim = '';
    try { const p = JSON.parse(qr); nim = String(p.nim || '').trim(); }
    catch { nim = String(qr||'').trim(); }
    if (!nim || nim.length < 3) { toast('NIM tidak valid', 'error'); beep('err'); return; }

    const m = State.mahasiswa.find(x => String(x.nim).trim() === nim);
    if (!m) { toast(`NIM ${esc(nim)} tidak terdaftar`, 'error'); beep('err'); return; }

    if (State.presensiHariIni[nim]) {
      toast(`${esc(m.nama)} sudah presensi`, 'warning');
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Sudah presensi';
      beep('err'); return;
    }

    const payload = { nim, nama:m.nama||'', kelas:m.kelas||'', jurusan:m.jurusan||'', mataKuliah:'Presensi Kelas', status:'Hadir' };

    let res;
    try { res = await apiPost('presensi', payload); }
    catch {
      State.presensiHariIni[nim] = { nim, tanggal:tgl, offline:true };
      savePrsCache(State.presensiHariIni); renderTable();
      toast(`📴 Offline — ${esc(m.nama)} dicatat lokal`, 'warning', 5000);
      return;
    }

    if (res.success) {
      State.presensiHariIni[nim] = { nim, tanggal:tgl, nama:m.nama };
      savePrsCache(State.presensiHariIni); renderTable();
      toast(`${esc(m.nama)} HADIR!`, 'success', 3500);
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Hadir!';
      beep('ok'); confetti();
      if (DOM.scannerArea) {
        DOM.scannerArea.classList.add('success-glow');
        setTimeout(() => DOM.scannerArea.classList.remove('success-glow'), 1000);
      }
    } else if (res.already) {
      State.presensiHariIni[nim] = { nim, tanggal:tgl };
      savePrsCache(State.presensiHariIni); renderTable();
      toast(`${esc(m.nama)} sudah presensi (server)`, 'warning', 3500);
      beep('err');
    } else {
      toast(res.error || 'Gagal simpan', 'error', 4000);
      beep('err');
    }
  } catch (err) {
    toast('Error: ' + err.message, 'error', 4000);
    beep('err');
  } finally {
    setTimeout(() => {
      State.processing = false;
      if (DOM.scanStatus) DOM.scanStatus.textContent = 'Arahkan ke QR Code';
      if (!State.scanning) startScanner();
    }, CONFIG.RESCAN_MS);
  }
}

/* ============ FLASH ============ */
async function toggleFlash() {
  State.flashOn = !State.flashOn;
  if (!DOM.btnFlash) return;
  DOM.btnFlash.classList.toggle('active', State.flashOn);
  DOM.btnFlash.innerHTML = State.flashOn ? '<i class="fas fa-bolt" style="color:#fff;"></i>' : '<i class="fas fa-bolt"></i>';
  try {
    const v = document.querySelector('#qr-reader video');
    if (!v || !v.srcObject) return;
    const t = v.srcObject.getVideoTracks()[0]; if (!t) return;
    const c = t.getCapabilities ? t.getCapabilities() : {};
    if (c.torch) await t.applyConstraints({advanced:[{torch:State.flashOn}]});
  } catch {}
}

/* ============ THEME ============ */
function initTheme() {
  const saved = localStorage.getItem(CONFIG.CK_THEME);
  const btn = $('themeToggle');
  if (saved === 'dark') {
    document.body.classList.add('dark');
    if (btn) btn.innerHTML = '<i class="fas fa-sun"></i>';
  }
  if (btn) btn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    localStorage.setItem(CONFIG.CK_THEME, isDark ? 'dark' : 'light');
  });
}

/* ============ CLOCK ============ */
function updateClock() {
  const n = new Date();
  const time = n.toLocaleTimeString('id-ID', {hour12:false, hour:'2-digit', minute:'2-digit'});
  const date = n.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'short'});
  if ($('clockText')) $('clockText').textContent = time;
  if ($('clockDate')) $('clockDate').textContent = date;
}

/* ============ CAMERA PERM ============ */
async function checkCam() {
  try {
    if (!navigator.mediaDevices) { toast('Browser tidak mendukung kamera', 'error', 0); return false; }
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    s.getTracks().forEach(t => t.stop());
    return true;
  } catch { toast('Izin kamera diperlukan', 'error', 0); return false; }
}

/* ============ INIT ============ */
async function init() {
  State.tanggalHariIni = todayStr();
  initTheme();
  updateClock();
  setInterval(updateClock, 1000);
  const link = CONFIG.SHEET_URL + '#gid=' + CONFIG.SHEET_GID_PRESENSI;
  if ($('sheetLink')) $('sheetLink').href = link;
  generateQR();
  await loadAllData();
  setInterval(() => loadAllData(), CONFIG.REFRESH_MS);
  const ok = await checkCam();
  if (ok) setTimeout(startScanner, 800);
}

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('beforeunload', () => {
  if (State.scanner && State.scanning) {
    State.scanner.stop().then(() => { try { State.scanner.clear(); } catch {} }).catch(()=>{});
  }
});
</script>
